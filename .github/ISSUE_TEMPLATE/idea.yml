name: Idea
description: Something Choreganized could do
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What would that make easier?
      description: The problem behind the idea is usually the more useful half.
    validations:
      required: false
