# Regenerate the visual baselines on a branch, from CI's own container — for
# when a screen changed on purpose and nobody has Docker to hand
# (→ docs/TESTING.md "Visual", DECISIONS #140). Actions → Update visual
# baselines → Run workflow, on the branch that needs them.
#
# The commit is pushed with the workflow's own token, so two things follow: it
# only works on an unprotected branch (a PR branch — `dev` and `main` refuse the
# push once the required checks are on), and GitHub never starts a workflow from
# what that token pushes, so re-run CI afterwards:
#   gh workflow run ci.yml --ref <branch>
# and look at the new PNGs in the diff before you trust them.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright test --project=visual --update-snapshots
        env:
          CI: 1
      - name: Commit the new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines already match — nothing to commit."
          else
            git commit -m "Visual: refresh the Linux baselines" \
              -m "Regenerated by the update-snapshots workflow on ${GITHUB_REF_NAME}."
            git push
          fi
