# Triage every new issue once, and only ever say something about it.
#
# The agent labels, dedupes, locates the cause in the source, and drafts the plan
# in this repo's own format — it never writes code (→ docs/plans/16-feedback.md).
# Building stays local, where the dev server is and where this repo's definition
# of done can actually be met.
#
# NOTE: workflows for `issues` events are read from the DEFAULT branch. This file
# does nothing until it is merged to `main`.
name: Triage

on:
  issues:
    types: [opened]
  # Re-triage an issue by hand — after a prompt change, or when a run ran out of
  # turns. Actions → Triage → Run workflow.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re-)triage
        required: true
        type: string

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # Read-only on the repository is the guardrail that matters — issue bodies
      # are untrusted input, and the prompt's "never edit a file" is only a
      # second line of defence. `issues: write` is for labels and the comment;
      # `id-token: write` lets the action mint its short-lived GitHub App token.
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          # `dev` is the superset: it carries whatever is built but not yet
          # deployed, so triage can tell "already fixed" from "still broken".
          ref: dev
          fetch-depth: 0
          # Triage reads and never pushes, and it may WebFetch a page an
          # untrusted issue names: no job token left in .git/config to send
          # there (→ plan 25).
          persist-credentials: false

      # Node and the app's dependencies: `npm run import:probe` reads a linked
      # recipe page through the importer itself (→ plan 25), and the run summary
      # below is a Node script.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # No `github_token:` on purpose. Omitted, the action mints a
          # repo-scoped token from the Claude GitHub App and comments as
          # claude[bot]; passing secrets.GITHUB_TOKEN instead would mean GitHub
          # never triggers workflows from what it does.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Supplying a prompt puts the action in automation mode: it fires on
          # the event itself, with no @claude mention and no label_trigger.
          prompt: '/triage-issue ${{ github.event.issue.number || inputs.issue }}'
          # --max-turns: 20 was too tight. The first real run spent all of it
          # reading the issue, deduping, grepping the code and setting labels,
          # and died before it could write the comment — which is the whole
          # output. A run costs roughly $0.30; the ceiling is a stop, not a
          # target. The model is pinned (→ plan 25): Sonnet is fast and cheap
          # enough for reading, and the action's default can change under a
          # Claude Code update without anyone noticing. WebFetch reads a page
          # the report links to — without it, headless Claude Code refuses
          # silently and the agent guesses (issue #31). (Comments must stay out
          # of the block scalar below: inside `|` a # is literal text and would
          # be passed to the CLI as an arg.)
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,WebFetch,Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(npm run import:probe:*)"

      # The receipt (→ plan 25): model, turns, cost, every denied tool call and
      # every command, on the run's summary page — no message text. Runs when
      # the agent failed too; that is when it matters most.
      - name: Run summary
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/agent-run-summary.ts "$EXECUTION_FILE" --title Triage
