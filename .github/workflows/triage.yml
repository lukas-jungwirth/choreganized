# Triage every new issue once, and only ever say something about it.
#
# The agent dedupes, locates the cause in the source, and drafts the plan in this
# repo's own format — it never writes code (→ docs/plans/16-feedback.md). Since
# plan 26 it decides and the workflow acts (→ DECISIONS #164):
#
#   probe   no Claude, no secrets: `npm run import:probe` on every page the issue
#           links to, handed to triage as a file — the agent itself has no web;
#   triage  reads the issue, the code and that report, posts its one comment, and
#           returns a verdict shaped by scripts/triage-verdict.schema.json;
#   apply   no Claude: sets the labels and the title from the verdict, and starts
#           a build only for a small bug the probe reproduced.
#
# NOTE: workflows for `issues` events are read from the DEFAULT branch. This file
# does nothing until it is merged to `main`.
name: Triage

on:
  issues:
    types: [opened]
  # Re-triage an issue by hand — after a prompt change, or when a run ran out of
  # turns. Actions → Triage → Run workflow.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re-)triage
        required: true
        type: string

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}

jobs:
  # The pages a report links to, read the way an import reads them, before any
  # agent runs. The links come from the issue, never from an agent; the importer's
  # own guards (no private addresses, a size cap) apply, and nothing here holds a
  # secret worth sending anywhere.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Read the issue's links
        id: links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: node scripts/issue-probe.ts links "$RUNNER_TEMP/links.txt"

      # The importer only loads inside Vite, so the probe needs the app's
      # dependencies — and only when there is a page to read.
      - if: steps.links.outputs.count != '0'
        run: npm ci --no-audit --no-fund

      - name: Probe each page
        run: node scripts/issue-probe.ts probe "$RUNNER_TEMP/links.txt" "$RUNNER_TEMP/probe/report.md"

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe/report.md
          retention-days: 14

  triage:
    needs: probe
    # A probe that failed is a report triage goes without, not a reason to skip
    # the triage.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # Read-only on the repository is the guardrail that matters — issue bodies
      # are untrusted input, and the prompt's "never edit a file" is only a
      # second line of defence. `issues: write` is for the comment; the labels
      # and the title are the apply job's. `id-token: write` lets the action
      # mint its short-lived GitHub App token.
      contents: read
      issues: write
      id-token: write
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}

    steps:
      - uses: actions/checkout@v6
        with:
          # `dev` is the superset: it carries whatever is built but not yet
          # deployed, so triage can tell "already fixed" from "still broken".
          ref: dev
          fetch-depth: 0
          # Triage reads and never pushes, and it reads untrusted text: no
          # job token left in .git/config for a steered agent to find
          # (→ plan 25).
          persist-credentials: false

      # Node for the run summary below — a dependency-free script, so no
      # `npm ci`.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Outside /tmp, the one place the agent may write: the report is evidence,
      # not a draft.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: probe
          path: ${{ runner.temp }}/probe

      # The verdict's shape, from the file triage-apply.ts validates against too.
      - name: Verdict schema
        id: schema
        run: echo "json=$(jq -c 'del(."$comment")' scripts/triage-verdict.schema.json)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # No `github_token:` on purpose. Omitted, the action mints a
          # repo-scoped token from the Claude GitHub App and comments as
          # claude[bot]; passing secrets.GITHUB_TOKEN instead would mean GitHub
          # never triggers workflows from what it does.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Supplying a prompt puts the action in automation mode: it fires on
          # the event itself, with no @claude mention and no label_trigger.
          prompt: '/triage-issue ${{ github.event.issue.number || inputs.issue }} ${{ runner.temp }}/probe/report.md'
          # --max-turns: 20 was too tight. The first real run spent all of it
          # reading the issue, deduping, grepping the code and setting labels,
          # and died before it could write the comment — which is the whole
          # output. A run costs roughly $0.30; the ceiling is a stop, not a
          # target. The model is pinned (→ plan 25): Sonnet is fast and cheap
          # enough for reading, and the action's default can change under a
          # Claude Code update without anyone noticing.
          #
          # No web at all (→ DECISIONS #163): WebFetch and the import probe
          # both open any URL, so a steered agent could carry what it read
          # out in one; the probe job above reads a linked page instead.
          # WebFetch and WebSearch are denied, not just unlisted, so they are
          # never offered and never tried. `Edit(//tmp/**)` is the one place it may write:
          # the comment, as a file for `gh issue comment --body-file` — a
          # multi-line comment does not fit a command line (issue #48: 7
          # refused tries, one run-on paragraph). An allow rule for writing is
          # spelled Edit, and `//` makes the path absolute. `--add-dir` lets
          # it read the probe report, which sits outside the checkout and
          # outside /tmp, so it reads its evidence but cannot rewrite it.
          #
          # No `gh issue edit` (→ plan 26): the agent returns its verdict as
          # --json-schema structured output, and the apply job labels from it.
          # (Comments must stay out of the block scalar below: inside `|` a #
          # is literal text and would be passed to the CLI as an arg.)
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit(//tmp/**),Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
            --disallowedTools "WebFetch,WebSearch"
            --add-dir ${{ runner.temp }}/probe
            --json-schema '${{ steps.schema.outputs.json }}'

      # The receipt (→ plan 25): model, turns, cost, every denied tool call and
      # every command, on the run's summary page — no message text. Runs when
      # the agent failed too; that is when it matters most.
      - name: Run summary
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/agent-run-summary.ts "$EXECUTION_FILE" --title Triage

  # The agent decides, the workflow acts. No Claude here: the verdict is data,
  # read through env (never pasted into a script), and every label comes from
  # an enum in scripts/triage-apply.ts.
  apply:
    needs: triage
    # Explicit, or a failed probe job (an ancestor) would skip this even though
    # triage ran and commented.
    if: ${{ !cancelled() && needs.triage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # `gh workflow run build.yml`. A label added with this job's token would
      # start no workflow; a dispatch does.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      VERDICT: ${{ needs.triage.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Labels and title from the verdict
        run: node scripts/triage-apply.ts

      # The automatic path into the build lane, and the only one (→ plan 26).
      # A small bug whose symptom the probe showed on `dev`, whose cause triage
      # found, with nothing left to ask and nothing on `dev` that fixes it
      # already. A cause found only by reading the source waits for a person,
      # who adds `agent:build` as before. `agent:build` goes on first so the
      # issue says what is happening; this token's label starts nothing itself.
      # An issue that already carries it was handed on before (a re-triage by
      # hand): no second build.
      - name: Hand on to the build
        if: >-
          ${{ fromJSON(env.VERDICT).kind == 'bug' &&
          fromJSON(env.VERDICT).size == 's' &&
          fromJSON(env.VERDICT).reproduced == true &&
          fromJSON(env.VERDICT).confidence == 'found' &&
          join(fromJSON(env.VERDICT).open_questions, '') == '' &&
          fromJSON(env.VERDICT).fixed_on_dev_commit == '' }}
        run: |
          if gh issue view "$ISSUE" --json labels -q '.labels[].name' | grep -qx 'agent:build'; then
            echo "#$ISSUE already carries agent:build — not starting a second build."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label agent:build
          gh workflow run build.yml -f issue="$ISSUE"
