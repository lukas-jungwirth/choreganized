<!doctype html>
<!-- `lang` and `data-theme` are filled per request in hooks.server.ts: they are
	 the attributes of the document no component can reach. A screen reader picks
	 its voice from `lang`; `data-theme` carries the chosen theme so the very
	 first paint is already the right one — with no cookie it expands to nothing
	 at all, which is what lets `color-scheme: light dark` follow the device
	 (→ app.css, `$lib/theme`). -->
<html lang="%lang%" %theme%>
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes every `env(safe-area-inset-*)` in the
			 app resolve to a real value on notched phones — without it they are 0
			 and the tab bar / FAB / sheets sit under the home indicator. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- Icons + PWA. theme-color and description are deliberately NOT here: both
			 are set once in the root layout, theme-color so cook mode can swap it
			 dark and description because it is copy and has to speak the reader's
			 language (a second meta here would win, being first in the head). -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-96.png"
			sizes="96x96"
			type="image/png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- Served per request, not static, so the splash screen opens in the right
			 theme (→ routes/manifest.webmanifest). `use-credentials` is what makes
			 the theme cookie travel with it: a manifest is fetched with credentials
			 omitted by default, even same-origin, so without this the route would
			 never see a pinned theme. -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<meta name="application-name" content="Choreganized" />
		<meta name="apple-mobile-web-app-title" content="Choreganized" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
