<html lang="de"><head><meta charset="utf-8"><title>Veganes Kürbis-Curry mit Kokosmilch und Orange |  Rezept | Zucker&amp;Jagdwurst</title>
<script class="hidden sr-only" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Recipe","@id":"https://www.zuckerjagdwurst.com/de/rezepte/veganes-kuerbis-curry-mit-kokosmilch-orange#recipe-3cc3f641-f43b-4f1c-953c-cbb343da0e53","name":"Veganes Kürbis-Curry mit Orange","url":"https://www.zuckerjagdwurst.com/de/rezepte/veganes-kuerbis-curry-mit-kokosmilch-orange","inLanguage":"de","mainEntityOfPage":{"@type":"WebPage","@id":"https://www.zuckerjagdwurst.com/de/rezepte/veganes-kuerbis-curry-mit-kokosmilch-orange"},"publisher":{"@id":"https://www.zuckerjagdwurst.com/#organization"},"image":["https://assets.zuckerjagdwurst.com/cdn-cgi/image/width=1200,height=1200,quality=85,format=auto,fit=cover/assets/521348ae-8b64-43f7-93d0-a2f50637a9f9/de/3820808c-b161-42c3-90b7-90f91287f414.jpg","https://assets.zuckerjagdwurst.com/cdn-cgi/image/width=1200,height=900,quality=85,format=auto,fit=cover/assets/521348ae-8b64-43f7-93d0-a2f50637a9f9/de/3820808c-b161-42c3-90b7-90f91287f414.jpg","https://assets.zuckerjagdwurst.com/cdn-cgi/image/width=1200,height=675,quality=85,format=auto,fit=cover/assets/521348ae-8b64-43f7-93d0-a2f50637a9f9/de/3820808c-b161-42c3-90b7-90f91287f414.jpg"],"description":"Veganes Kürbis-Curry mit Orange: cremige Soße, knuspriger Tofu, Basmatireis und frischer Orangensalat. So gelingt das Herbstgericht ganz einfach und schnell.","datePublished":"2026-10-08T23:00:00.000Z","author":[{"@type":"Person","name":"Isa Zucker"}],"recipeCategory":["Vegane Kürbis-Rezepte","Vegane Rezepte mit Reis","Vegane Hauptgerichte"],"totalTime":"PT50M","recipeYield":"4 Portionen","recipeIngredient":["Für den Orangensalat:","3 Orangen (z. B. von gebana)","0.5 rote Zwiebel","0.5 kleine Chili","10 g frischer Koriander","75 g Cashewkerne","2 EL Olivenöl","1 TL schwarze Senfsamen","3 EL Orangensaft","0.5 TL Agavendicksaft","1 TL Chaat Masala","Kokosöl","Salz","Für das Curry:","800 g Hokkaido-Kürbis","400 g Naturtofu","1 Zwiebel","2 Knoblauchzehen","30 g Ingwer","1 kleine Chili","1 TL gemahlener Kreuzkümmel","2 TL gemahlener Koriander","1 TL Kurkuma","2 TL Garam Masala","200 ml passierte Tomaten","200 ml Gemüsebrühe","400 ml Kokosmilch","2 EL Agavendicksaft","2 Orangen (Saft und Abrieb) (z. B. von gebana)","Kokosöl zum Anbraten","Salz","Pfeffer","Außerdem:","300 g Basmatireis","75 g Cashewkerne","Zum Servieren:","Kokosmilch / vegane Kochsahne","frischer Koriander","Chiliöl","Orangen (z. B. von gebana)"],"recipeInstructions":[{"@type":"HowToStep","text":"Orangensalat (dieser kann gern durchziehen, bis das Curry fertig ist):"},{"@type":"HowToStep","text":"1. Orangen schälen und in Scheiben schneiden. Rote Zwiebel in feine Halbringe und Chili in dünne Ringe schneiden, Koriander von den Stielen abzupfen. Cashewkerne in einer Pfanne mit Kokosöl anbraten, bis sie goldbraun sind."},{"@type":"HowToStep","text":"2. Olivenöl in einer kleinen Pfanne bei mittlerer Hitze erhitzen. Senfsamen hineingeben und kurz rösten, bis sie anfangen zu knistern und zu springen."},{"@type":"HowToStep","text":"3. Orangensaft, Agavendicksaft und Chaat Masala in einer kleinen Schüssel vermengen. Das heiße Senfsamen-Öl dazugeben, gut verrühren und mit Salz abschmecken."},{"@type":"HowToStep","text":"4. Orangen, Zwiebeln und Chili auf einem Teller anrichten, Soße darübergießen und mit Koriander sowie Cashewkernen bestreuen."},{"@type":"HowToStep","text":"Kürbis-Curry:"},{"@type":"HowToStep","text":"Kürbis waschen und in Spalten schneiden. Tofu etwas ausdrücken und in Würfel schneiden. Zwiebel, Knoblauch und Ingwer würfeln, Chili in Ringe schneiden. Am Ende wird die Soße püriert, daher müsst ihr nicht besonders fein schneiden."},{"@type":"HowToStep","text":"Etwas Kokosöl in einer großen und hohen Pfanne erwärmen. Tofuwürfel 4–5 Minuten von allen Seiten goldbraun anbraten, mit Salz und Pfeffer würzen und beiseitestellen."},{"@type":"HowToStep","text":"Gegebenenfalls nochmal Kokosöl erhitzen und den Kürbis von beiden Seiten braun anbraten. Danach ebenfalls beiseitestellen."},{"@type":"HowToStep","text":"Gegebenenfalls nochmal Kokosöl erhitzen und Zwiebeln darin anschwitzen, bis sie glasig sind. Knoblauch, Ingwer und Chili dazugeben und weitere 2–3 Minuten mitbraten. Kreuzkümmel, Koriander, Kurkuma und Garam Masala einrühren und circa 1 Minute weiterbraten."},{"@type":"HowToStep","text":"Mit passierten Tomaten, Gemüsebrühe und Kokosmilch ablöschen. Kurz aufkochen lassen und pürieren."},{"@type":"HowToStep","text":"Kürbis zurück in die Pfanne geben und mit geschlossenem Deckel bei mittlerer Hitze circa 15–20 Minuten köcheln lassen, bis der Kürbis weich ist."},{"@type":"HowToStep","text":"Den Basmatireis nach Packungsanleitung zubereiten."},{"@type":"HowToStep","text":"Wenn der Kürbis weich ist, den Tofu unterrühren und mit Agavendicksaft, Gewürzen sowie Orangensaft und Abrieb abschmecken."},{"@type":"HowToStep","text":"Das Curry mit Basmatireis und dem Orangensalat servieren. Mit einem Schuss Kokosmilch, Cashewkernen, frischem Koriander, Chiliöl und ein paar Orangenspalten anrichten."}]}]}</script>
