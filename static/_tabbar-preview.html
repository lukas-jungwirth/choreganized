<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TabBar preview</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --sage: #5f8d72;
    --text-4: #8a867e;
    --text-5: #a7a29a;
    --ink: #22201c;
    --danger: #c0473a;
    --on-sage: #ffffff;
    --tabbar-bg: rgba(255, 255, 255, 0.9);
    --tabbar-border: rgba(236, 233, 226, 0.8);
    --tabbar-pill: rgba(95, 141, 114, 0.14);
    --tabbar-active: #3f6b52;
    --shadow-tabbar: 0 -10px 26px -14px rgba(40, 34, 24, 0.16);
    --tabbar-h: 84px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .phone {
    position: relative; width: 480px; min-height: 640px; margin: 40px auto;
    background: var(--bg); border-radius: 36px; overflow: hidden;
    box-shadow: 0 24px 50px -22px rgba(40,34,24,.3), 0 0 0 1px rgba(0,0,0,.05);
  }
  .content { padding: 28px 22px; }
  .content h1 { font-size: 26px; margin: 0 0 16px; }
  .row { height: 64px; background: #fff; border-radius: 18px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(40,34,24,.05); }
  .cols { display: flex; gap: 12px; }
  .cols > div { flex: 1; height: 78px; background: #fff; border-radius: 18px; box-shadow: 0 1px 3px rgba(40,34,24,.05); }

  /* ── component styles (copied verbatim from TabBar.svelte) ── */
  .tabbar {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 480px; height: var(--tabbar-h);
    padding: 0 22px; border-top: 1px solid var(--tabbar-border);
    background: var(--tabbar-bg); box-shadow: var(--shadow-tabbar);
    backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
  }
  .bubble {
    position: absolute; left: 0; top: 0; border-radius: 20px;
    background: var(--tabbar-pill); opacity: 0; pointer-events: none; z-index: 0;
    will-change: transform, width;
  }
  .bubble.ready {
    opacity: 1;
    transition:
      transform .44s cubic-bezier(.34,1.26,.5,1),
      width .44s cubic-bezier(.34,1.26,.5,1),
      height .44s cubic-bezier(.34,1.26,.5,1),
      opacity .25s ease;
  }
  .slow .bubble.ready { transition-duration: 2.4s, 2.4s, 2.4s, .25s; }
  .tab {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 0;
    padding: 10px; border-radius: 20px; color: var(--text-5); white-space: nowrap;
    cursor: pointer;
  }
  .tab.active { gap: 9px; padding: 10px 18px; color: var(--tabbar-active); }
  .tab.active .icon { color: var(--sage); }
  .icon { position: relative; display: flex; align-items: center; justify-content: center; width: 23px; height: 23px; }
  .label { max-width: 0; overflow: hidden; opacity: 0; font-size: 13.5px; font-weight: 600; line-height: 1; transition: opacity .18s ease; }
  .tab.active .label { max-width: 140px; opacity: 1; transition: opacity .3s ease .08s; }
  .badge {
    position: absolute; top: -5px; left: 13px; display: flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px; border: 1.5px solid var(--card); border-radius: 8px;
    background: var(--danger); font-size: 10px; font-weight: 700; line-height: 1; color: var(--on-sage);
  }
  .toolbar { text-align: center; margin: 16px; }
  .toolbar button { font: inherit; padding: 6px 12px; margin: 0 4px; border-radius: 8px; border: 1px solid #ccc; background:#fff; cursor:pointer; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="document.body.classList.toggle('slow')">toggle slow-mo</button>
    <span id="state"></span>
  </div>
  <div class="phone">
    <div class="content">
      <h1 id="title">Home</h1>
      <div class="row"></div>
      <div class="cols"><div></div><div></div></div>
    </div>
    <nav class="tabbar" id="nav" aria-label="Sections">
      <span class="bubble" id="bubble" aria-hidden="true"></span>
    </nav>
  </div>

<script>
  const OUT = {
    Home: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 11.7 12 4l9.4 7.7"/><path d="M5 10.2v8.4a1 1 0 0 0 1 1h3.2v-4.3a1.8 1.8 0 0 1 3.6 0v4.3H18a1 1 0 0 0 1-1v-8.4"/></svg>',
    Shopping: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 9.7a1.4 1.4 0 0 1 1.4-1.5h10a1.4 1.4 0 0 1 1.4 1.5l.6 9.1a1.8 1.8 0 0 1-1.8 1.9H6.8a1.8 1.8 0 0 1-1.8-1.9z"/><path d="M9.2 10.6V7.3a2.8 2.8 0 0 1 5.6 0v3.3"/></svg>',
    Cooking: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5C4.8 14 3.3 12.3 3.3 10.4 3.3 8.2 5.1 6.5 7.3 6.6 8 4.5 9.9 3.3 12 3.3 14.1 3.3 16 4.5 16.7 6.6 18.9 6.5 20.7 8.2 20.7 10.4 20.7 12.3 19.2 14 17 14.5V19.4a.9.9 0 0 1-.9.9H7.9a.9.9 0 0 1-.9-.9Z"/><path d="M7 16.9h10"/></svg>',
    Tasks: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.2h8.5M4.5 12h8.5M4.5 16.8h5.5"/><path d="M16.6 6.4l1.7 1.7 3.1-3.2"/></svg>',
  };
  const FILL = {
    Home: '<svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M11 3.9a1.5 1.5 0 0 1 2 0l7.45 6.05A1.5 1.5 0 0 1 21 11.1V18.6A1.5 1.5 0 0 1 19.5 20h-3.7v-4.3a1.8 1.8 0 0 0-3.6 0V20H4.5A1.5 1.5 0 0 1 3 18.6V11.1a1.5 1.5 0 0 1 .55-1.16z"/></svg>',
    Shopping: '<svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M5.6 9.7a1.4 1.4 0 0 1 1.4-1.5h10a1.4 1.4 0 0 1 1.4 1.5l.6 9.1a1.8 1.8 0 0 1-1.8 1.9H6.8a1.8 1.8 0 0 1-1.8-1.9z"/><path d="M9.2 8.2V7.3a2.8 2.8 0 0 1 5.6 0v.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    Cooking: '<svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M7 14.5C4.8 14 3.3 12.3 3.3 10.4 3.3 8.2 5.1 6.5 7.3 6.6 8 4.5 9.9 3.3 12 3.3 14.1 3.3 16 4.5 16.7 6.6 18.9 6.5 20.7 8.2 20.7 10.4 20.7 12.3 19.2 14 17 14.5V19.4a.9.9 0 0 1-.9.9H7.9a.9.9 0 0 1-.9-.9Z"/><path d="M7.6 16.9h8.8" fill="none" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round"/></svg>',
    Tasks: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.2h8.5M4.5 12h8.5M4.5 16.8h5.5"/><path d="M16.6 6.4l1.7 1.7 3.1-3.2"/></svg>',
  };
  const TABS = ['Home','Shopping','Cooking','Tasks'];
  const OVERDUE = 3;
  let active = 0, ready = false;
  const nav = document.getElementById('nav');
  const bubble = document.getElementById('bubble');

  function render() {
    // remove old tabs (keep bubble)
    [...nav.querySelectorAll('.tab')].forEach(n => n.remove());
    TABS.forEach((label, i) => {
      const a = document.createElement('a');
      a.className = 'tab' + (i === active ? ' active' : '');
      a.innerHTML =
        '<span class="icon">' + (i === active ? FILL[label] : OUT[label]) +
        (label === 'Tasks' && OVERDUE > 0 ? '<span class="badge">' + OVERDUE + '</span>' : '') +
        '</span><span class="label">' + label + '</span>';
      a.onclick = () => { active = i; document.getElementById('title').textContent = label; render(); measure(); };
      nav.appendChild(a);
    });
  }
  function measure() {
    const el = nav.querySelectorAll('.tab')[active];
    if (!el) return;
    bubble.style.transform = 'translate(' + el.offsetLeft + 'px, ' + el.offsetTop + 'px)';
    bubble.style.width = el.offsetWidth + 'px';
    bubble.style.height = el.offsetHeight + 'px';
    document.getElementById('state').textContent = 'active=' + TABS[active] + '  x=' + el.offsetLeft + ' w=' + el.offsetWidth;
  }
  render();
  measure();
  requestAnimationFrame(() => { bubble.classList.add('ready'); });
</script>
</body>
</html>
